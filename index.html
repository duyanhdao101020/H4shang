<style>
:root{--bg:#f6f4ef;--c:#fff;--t:#222;--m:#6b6b6b;--a:#b3261e;--ok:#1b7a3d;--ng:#b3261e;--bd:#ddd6c8}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a18;--c:#262421;--t:#eee;--m:#a9a49a;--a:#ef8a80;--ok:#6fd392;--ng:#ef8a80;--bd:#3d3a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.7 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
main{max-width:820px;margin:auto;padding:16px 14px 80px}
h1{font-size:24px;margin:.3em 0}h2{font-size:19px;margin:0 0 4px;color:var(--a)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.note{background:#fff4d6;color:#5a4300;border-left:4px solid #e0a800;padding:6px 10px;margin:8px 0;font-size:15px;border-radius:4px}
.q{padding:12px 0;border-top:1px dashed var(--bd)}.q:first-of-type{border-top:0}
.opt{display:block;padding:7px 10px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--a)}.opt input{margin-right:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--a);background:var(--c);color:var(--a);border-radius:8px;padding:5px 12px}

.tk{margin:3px;padding:4px 10px;color:var(--t);border-color:var(--bd)}
.pool,.line{min-height:44px;padding:6px;border:1px dashed var(--bd);border-radius:8px;margin:6px 0}
.line{border-style:solid}
input[type=text]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--c);color:var(--t)}
.py{color:var(--m);font-size:16px}.pass{background:var(--bg);padding:10px 12px;border-radius:8px;margin:8px 0;text-indent:2em}
.sc{display:flex;gap:10px;flex-wrap:wrap}.sc div{flex:1;min-width:120px;text-align:center;padding:12px;border-radius:10px;background:var(--bg)}
.sc b{display:block;font-size:30px;color:var(--a)}
.rv{padding:8px 10px;margin:6px 0;border-left:4px solid var(--bd);font-size:15px;background:var(--bg);border-radius:4px}
.rv.ok{border-color:var(--ok)}.rv.ng{border-color:var(--ng)}.rv.pt{border-color:#e0a800}
.rv i{color:var(--m);font-style:normal}
#tm{position:fixed;right:6px;bottom:4px;line-height:1}#tm span{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;margin-left:3px;opacity:.28}
#tm.show{opacity:1;font-size:13px;background:#000;color:#fff;padding:4px 8px;border-radius:6px}
@media print{button,.note{display:none}}

<h1>HSK 4 上 · Đề tổng kết 标准教程 第1–10课</h1>
<div class="card" id="intro">
<p>Đề gồm <b>Nghe 听力 (100) + Đọc 阅读 (100) + Viết 书写 (100) = 300 điểm</b>. Tất cả đều là <b>câu hoàn chỉnh</b>: hãy nghe/đọc hết cả câu rồi mới trả lời.</p>
<p>Bấm ▶ để nghe (nghe lại bao nhiêu lần cũng được). Cần gõ chữ Hán bằng bàn phím pinyin.</p>

const $=s=>document.querySelector(s);
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=(s,g)=>{s=(s||'').replace(/[^\u4e00-\u9fffA-Za-z0-9]/g,'').toLowerCase();return g?s.replace(/她/g,'他'):s};
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>{const m=Math.max(a.length,b.length);return m?1-lev(a,b)/m:1};
let _a;function tts(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function play(id,t){let d=0;const f=()=>{if(!d){d=1;tts(t)}};try{speechSynthesis.cancel()}catch(e){}if(_a)_a.pause();_a=new Audio('audio/'+id+'.mp3');_a.addEventListener('error',f);_a.play().catch(e=>{if(e.name!=='AbortError')f()})}

const ALL=[],SK={L:'Nghe 听力',R:'Đọc 阅读',W:'Viết 书写'};
const add=o=>{o.n=ALL.filter(x=>x.sec===o.sec).length+1;ALL.push(o)};
D.La.forEach(x=>add({sk:'L',sec:'LA',k:'mcq',pts:5,id:x.id,t:x.t,o:sh(x.o),c:x.o[0]}));
D.Lb.forEach(x=>add({sk:'L',sec:'LB',k:'typ',pts:10,id:x.id,t:x.t,ans:[x.t],g:1}));
D.Ra.forEach(x=>{let s=sh(x.tok);while(s.join()===x.tok.join()||(x.alt||[]).some(a=>a.join()===s.join()))s=sh(x.tok);add({sk:'R',sec:'RA',k:'ord',pts:5,tok:s,ans:[x.tok.join(''),...(x.alt||[]).map(a=>a.join(''))],sel:[]})});
D.Rb.forEach(x=>add({sk:'R',sec:'RB',k:'mcq',pts:5,q:x.q,o:sh(x.o),c:x.o[0]}));
D.Rc.forEach((p,pi)=>p.qs.forEach((q,qi)=>add({sk:'R',sec:'RC',k:'mcq',pts:10,p:qi?null:p.p,q:q[0],o:sh(q.slice(1)),c:q[1]})));
D.Wa.forEach(x=>add({sk:'W',sec:'WA',k:'typ',pts:12,py:x.py,ans:[x.ans],g:1}));
D.Wb.forEach(x=>add({sk:'W',sec:'WB',k:'typ',pts:10,vi:x.vi,ans:x.ans}));

const NOPUNC='⚠ Lưu ý: <b>không cần gõ dấu câu, không cần dấu cách</b> (gõ liền một mạch).';
const SEC={
 LA:['🎧 Nghe · Phần A','Nghe cả câu, chọn câu có <b>ý nghĩa đúng nhất</b>. (mỗi câu 5 điểm)'],
 LB:['🎧 Nghe · Phần B','Nghe rồi gõ lại <b>nguyên câu</b>. (mỗi câu 10 điểm)<div class="note">'+NOPUNC+' Chữ 她 và 他 đều được chấp nhận.</div>'],
 RA:['📖 Đọc · Phần A','Bấm các cụm từ để xếp thành <b>một câu hoàn chỉnh</b>. Bấm lại để bỏ ra. (mỗi câu 5 điểm)'],
 RB:['📖 Đọc · Phần B','Đọc cả câu, chọn từ điền vào chỗ trống. (mỗi câu 5 điểm)'],
 RC:['📖 Đọc · Phần C','Đọc cả đoạn văn rồi trả lời. (mỗi câu 10 điểm)'],
 WA:['✍️ Viết · Phần A','Đọc pinyin của cả câu, gõ lại thành chữ Hán. (mỗi câu 12 điểm)<div class="note">'+NOPUNC+' Chữ 她 và 他 đều được chấp nhận.</div>'],
 WB:['✍️ Viết · Phần B','Dịch cả câu tiếng Việt sang tiếng Trung. (mỗi câu 10 điểm)<div class="note">'+NOPUNC+'</div>']};

function draw(){
 const root=$('#exam');root.innerHTML='';let cur='',card;
 ALL.forEach((it,i)=>{
  if(it.sec!==cur){cur=it.sec;card=E('div','card','<h2>'+SEC[cur][0]+'</h2><div>'+SEC[cur][1]+'</div>');root.append(card)}
  if(it.p)card.append(E('div','pass',esc(it.p)));
  const q=E('div','q');q.append(E('b',0,it.n+'. '));
  if(it.id){const b=E('button','p','▶ Nghe');b.onclick=()=>play(it.id,it.t);q.append(b)}
  if(it.py)q.append(E('span','py',esc(it.py)));
  if(it.vi)q.append(E('span',0,esc(it.vi)));
  if(it.q)q.append(E('span',0,esc(it.q).replace('____','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')));
  if(it.k==='mcq')it.o.forEach(o=>{const l=E('label','opt');const r=E('input');r.type='radio';r.name='q'+i;r.onchange=()=>it.pick=o;l.append(r,o);q.append(l)});
  if(it.k==='typ'){const inp=E('input');inp.type='text';inp.lang='zh-CN';inp.autocomplete='off';inp.placeholder='gõ chữ Hán…';inp.style.marginTop='6px';it.inp=inp;q.append(inp)}
  if(it.k==='ord'){const ln=E('div','line'),pl=E('div','pool');const rd=()=>{ln.innerHTML='';pl.innerHTML='';it.sel.forEach(j=>{const b=E('button','tk',esc(it.tok[j]));b.onclick=()=>{it.sel=it.sel.filter(x=>x!==j);rd()};ln.append(b)});it.tok.forEach((t,j)=>{if(!it.sel.includes(j)){const b=E('button','tk',esc(t));b.onclick=()=>{it.sel.push(j);rd()};pl.append(b)}})};rd();q.append(ln,pl)}
  card.append(q)});
}
function grade(it){
 let a='',c='',s=0,tag='ng';
 if(it.k==='mcq'){a=it.pick||'';c=it.c;if(a===c)s=it.pts}
 else{a=it.k==='ord'?it.sel.map(j=>it.tok[j]).join(' '):it.inp.value;c=it.ans[0];const g=it.g?1:0,na=norm(it.k==='ord'?a:a,g);let b=0;it.ans.forEach(x=>b=Math.max(b,sim(na,norm(x,g))));
  s=b>=1?it.pts:it.k==='ord'?0:b>=.85?it.pts*.75:b>=.7?it.pts*.5:b>=.5?it.pts*.25:0}
 tag=s>=it.pts?'ok':s>0?'pt':'ng';return{a,c,s,tag}}
function finish(){
 const name=$('#name').value.trim();if(!name){alert('Hãy nhập họ tên trước khi nộp bài.');$('#name').scrollIntoView();$('#name').focus();return}
 const blank=ALL.filter(it=>it.k==='mcq'?!it.pick:it.k==='ord'?!it.sel.length:!it.inp.value.trim()).length;
 if(blank&&!confirm('Còn '+blank+' câu chưa làm. Vẫn nộp bài?'))return;
 const tot={L:0,R:0,W:0};ALL.forEach(it=>{it.r=grade(it);tot[it.sk]+=it.r.s});
 for(const k in tot)tot[k]=Math.min(100,Math.round(tot[k]));
 let n=1;try{const key='hsk4a_'+norm(name);n=(+localStorage.getItem(key)||0)+1;localStorage.setItem(key,n)}catch(e){}
 const sum=tot.L+tot.R+tot.W;
 let h='<div class="card"><h2>Kết quả · '+esc(name)+'</h2><div style="color:var(--m);font-size:14px">'+new Date().toLocaleString()+'</div><div class="sc" style="margin-top:10px">'+
  Object.keys(SK).map(k=>'<div>'+SK[k]+'<b>'+tot[k]+'</b>/100</div>').join('')+'<div>Tổng 总分<b>'+sum+'</b>/300</div></div>'+
  '<p><button onclick="print()">In / lưu PDF</button> <button onclick="location.reload()">Làm lại</button></p></div>';
 Object.keys(SK).forEach(k=>{h+='<div class="card"><h2>'+SK[k]+' · chi tiết</h2>';
  ALL.filter(x=>x.sk===k).forEach(it=>{const r=it.r;h+='<div class="rv '+r.tag+'"><i>'+it.sec+'-'+it.n+' · '+(Math.round(r.s*100)/100)+'/'+it.pts+'</i><br>Bạn: '+(esc(r.a)||'<i>(trống)</i>')+(r.tag==='ok'?'':'<br>Đáp án: <b>'+esc(r.c)+'</b>')+'</div>'});h+='</div>'});
 $('#res').innerHTML=h;$('#exam').style.display=$('#intro').style.display=$('#sub').style.display='none';scrollTo(0,0);
 const tm=$('#tm');tm.innerHTML='<span></span>'.repeat(n);tm.dataset.n=n;
 if(location.hash==='#gv'){tm.className='show';tm.textContent='Lần làm thứ '+n}
}
$('#sub').onclick=finish;draw();
</script></body></html>
